name: Render Video with Hyperframes

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Hyperframes
        run: npm install -g hyperframes

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Direct Render
        run: python render_direct.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: projects/local-agents/renders/final.mp4
